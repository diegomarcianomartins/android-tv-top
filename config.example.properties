# Configurações do Free My TV. Na primeira vez, o build.sh copia este arquivo para config.properties: edite aquele e
# rode o build de novo.

# Chave grátis em https://www.themoviedb.org/settings/api (o "API Read Access Token" ou a "API Key").
# Sem ela a tela inicial funciona, só não mostra as sugestões do momento.
tmdb_key=

# Seu país (duas letras): define quais títulos estão em qual app de streaming. BR, US, GB, CA, DE, FR...
tmdb_region=US

# Sua cidade, para o clima e para o pôr do sol que escurece a tela inicial à noite (graus decimais).
latitude=40.7128
longitude=-74.0060
# Opcional: o nome que aparece no cartão do clima (vazio = "Clima").
city=

# true tira desenhos e animes (o gênero Animação do TMDB) das sugestões.
hide_animation=false

# auto (segue a TV), ou um idioma de app/assets/i18n (pt, en, es, de, ru, fr, ja, zh-CN…)
language=auto

# true mostra cotações de criptomoedas da Binance na tela inicial e na tela de descanso.
show_crypto=true

# Moeda das cotações: BRL, USD, EUR... (só vale com show_crypto=true)
# (uma moeda sem pares na Binance, como INR, mostra as cotações em dólar)
currency=USD

# C, F ou auto (Fahrenheit quando a TV está configurada para os EUA)
temperature=auto

# true também desliga o Google Assistente ("Ok Google"); o botão de microfone do controle para de funcionar
disable_assistant=false

# Serviços de streaming que ficam fora das sugestões mesmo com o app na TV, separados por vírgula (Google TV):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay.
# Para apps que vêm na TV e que você não assina (o Prime Video de uma Sony, por exemplo).
hide_services=

# LG e Samsung: apps que ficam fora da barra, de Todos os Apps e das sugestões, separados por vírgula, pelo id ou pelo
# nome (parte dele, sem diferenciar maiúsculas). Para apps que vêm na TV e não podem ser desinstalados, como a Netflix
# de fábrica da Samsung: hide_apps=netflix
hide_apps=

# Opcional: uma chave grátis do Watchmode (watchmode.com) faz as sugestões abrirem a página do próprio título no app
# (Prime Video, JioHotstar...), e não só o app. Sem ela, abrem o app. Mantenha em segredo.
watchmode_key=

# Opcional: câmeras ao vivo de um DVR ou de câmeras IP na tela inicial (até 6, à direita; só sem as sugestões do TMDB).
# Com mais de 4, uma opção em cima do mosaico mostra 4 (2×2) ou 6 (3×2). Um endereço RTSP por câmera, separados por
# vírgula. Use o substream: é mais leve, e muitos streams principais juntos pesam demais para a TV (quando o substream
# de uma câmera não responde, o app usa o principal dela). OK numa câmera abre em tela cheia, no stream principal.
# Intelbras e Dahua: rtsp://USUARIO:SENHA@IP_DO_DVR:554/cam/realmonitor?channel=1&subtype=1
# Hikvision: rtsp://USUARIO:SENHA@IP_DO_DVR:554/Streaming/Channels/102. A senha fica aqui: mantenha em segredo.
dvr_cameras=
